server:
  port: 8083

spring:
  application:
    name: account-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres-account}:${POSTGRES_PORT:5432}/${POSTGRES_DB:account_db}
    username: ${POSTGRES_USER:account}
    password: ${POSTGRES_PASSWORD:account}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://discovery-service:8761/eureka/}
  instance:
    prefer-ip-address: true

resilience4j:
  ratelimiter:
    instances:
      accountServiceRl:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 100ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
